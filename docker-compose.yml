services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: avaliacoes

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avaliacoes
      DB_USER: usuario
      DB_PASSWORD: senha
    depends_on:
      - postgres
