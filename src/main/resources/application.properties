spring.application.name=avaliacoes

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avaliacoes}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://TROCAR-AUTH0-DOMAIN/
spring.security.oauth2.resourceserver.jwt.audience=TROCAR-AUTH0-AUDIENCE
